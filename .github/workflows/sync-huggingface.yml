name: Sync THE BETWEEN to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "platforms/huggingface/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish dataset archive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "marcosnauer/the-between"
          api.create_repo(
              repo_id=repo_id,
              repo_type="dataset",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="dataset",
              folder_path="platforms/huggingface",
              path_in_repo=".",
              commit_message="Sync THE BETWEEN from GitHub",
          )
          PY
